name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and the pinned Python
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Building through Compose is the same path `docker compose up --build`
      # takes locally, so a broken Dockerfile or an out-of-date uv.lock fails
      # here rather than at runtime.
      - name: Build the application image
        run: docker compose build api

      # The entrypoint waits for PostgreSQL and applies `alembic upgrade head`
      # before pytest runs, so this also proves the migrations apply to an
      # empty database. Compose supplies DATABASE_URL, so the integration
      # tests run instead of skipping.
      - name: Run tests against PostgreSQL
        run: docker compose run --rm api pytest

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
