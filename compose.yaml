services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_greenhouse}
      POSTGRES_USER: ${POSTGRES_USER:-ai_greenhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_greenhouse_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
    environment:
      APP_NAME: ${APP_NAME:-ai-greenhouse-api}
      APP_ENV: ${APP_ENV:-local}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ai_greenhouse:ai_greenhouse_dev@postgres:5432/ai_greenhouse}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['APP_PORT'] + '/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
