[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-greenhouse"
version = "0.1.0"
description = "AI Greenhouse backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.139,<1",
    "pydantic-settings>=2.14,<3",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "structlog>=25.4,<26",
    "tzdata>=2025.2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_greenhouse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The project root is on the path so the integration tests can import their
# shared request builders as `tests.integration.factories`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# `tests` is a package of this repository, not a dependency: the integration
# tests import their shared request builders from `tests.integration.factories`.
known-first-party = ["ai_greenhouse", "tests"]
